name: One-time fix offer guide links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix offer guide links and bonus label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/components/upsell/TuGemeloDigitalPage.tsx")
          s = p.read_text()
          old = 'elEspejoDigitalCover, "El Espejo Digital", "Bono", "Reflexión guiada con el apoyo de ChatGPT"'
          new = 'elEspejoDigitalCover, "Bono", "", "Reflexión guiada con el apoyo de ChatGPT"'
          if old not in s:
              raise SystemExit("offer bonus source pattern not found")
          s = s.replace(old, new, 1)

          old = '].map(([cover, nome, tag, desc]) => <article key={nome as string}'
          new = '].map(([cover, nome, tag, desc]) => <a href={nome === "Tu Mente en GPT" ? "#tu-mente-en-gpt" : nome === "Tu Segundo Cerebro" ? "#tu-segundo-cerebro" : nome === "Tu Gemelo Digital" ? "#tu-gemelo-digital" : "#el-espejo-digital"} key={nome as string}'
          if old not in s:
              raise SystemExit("offer card wrapper pattern not found")
          s = s.replace(old, new, 1)

          old = 'mt-2 flex items-center justify-center gap-2 text-lg font-bold text-upsell-light-text">{nome}{tag === "Bono" ? <span className="inline-flex rounded-full bg-upsell-gold/15 px-2 py-0.5 text-[10px] font-bold tracking-wider text-upsell-gold uppercase">Bono</span> : null}</h3>'
          new = 'mt-2 flex items-center justify-center gap-2 text-lg font-bold text-upsell-light-text">{nome}</h3>'
          if old not in s:
              raise SystemExit("offer bonus duplicate badge pattern not found")
          s = s.replace(old, new, 1)

          old = '</article>)}'
          new = '</a>)}'
          if old not in s:
              raise SystemExit("offer card closing pattern not found")
          s = s.replace(old, new, 1)

          old = '<ProdutoIndividual cover={tuGemeloDigitalCover} etiqueta="03 · PRESENCIA DIGITAL"'
          new = '<ProdutoIndividual id="tu-gemelo-digital" cover={tuGemeloDigitalCover} etiqueta="03 · PRESENCIA DIGITAL"'
          if old not in s:
              raise SystemExit("Tu Gemelo Digital id pattern not found")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- src/components/upsell/TuGemeloDigitalPage.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/upsell/TuGemeloDigitalPage.tsx .github/workflows/fix-offer-guides.yml
          git commit -m "fix offer guide links and bonus label"
          git push
          rm .github/workflows/fix-offer-guides.yml
          git add .github/workflows/fix-offer-guides.yml
          git commit --amend --no-edit
          git push --force-with-lease
